telegram:
  # polling  — плагин сам общается с Telegram. Ничего открывать наружу не нужно.
  #            Подходит для панельных хостингов. Внешний бот НЕ нужен.
  # api      — общаться будет отдельный бот (папка bot/), плагин поднимет HTTP-сервер.
  mode: "polling"

  # Токен от @BotFather
  bot-token: ""
  # Юзернейм бота без @ — показывается игроку при регистрации
  bot-username: "MyServerAuthBot"
  # Название сервера в сообщениях
  server-name: "Мой сервер"
  # Адрес сервера — показывается игрокам в приветствии бота
  server-ip: "play.example.ru"

# Нужно ТОЛЬКО при mode: api
api:
  # Слушаем только localhost. Меняйте на 0.0.0.0 ТОЛЬКО если бот на другой машине,
  # и тогда обязательно закройте порт фаерволом.
  bind: "127.0.0.1"
  port: 8787
  # Общий секрет плагина и бота. Придумайте длинную строку.
  token: "СМЕНИТЕ_МЕНЯ_НА_ДЛИННУЮ_СЛУЧАЙНУЮ_СТРОКУ"

auth:
  # Сколько живёт код регистрации
  code-lifetime-seconds: 300
  # Сколько ждём нажатия кнопки при входе с нового IP
  confirm-timeout-seconds: 60
  # Сколько дней IP считается доверенным (вход без подтверждения)
  trusted-days: 7
  # Длина кода
  code-length: 6
  # Слепота до авторизации, чтобы не осматривались
  blindness: true

messages:
  register-1: "&8&m                                        "
  register-2: "&eДля игры нужна привязка Telegram. Откройте &f@{bot}"
  register-3: "&eи отправьте боту код: &a&l{code}"
  title-register: "&eПривязка Telegram"
  subtitle-code: "&fКод: &a{code}"
  actionbar-code: "&eКод &a{code} &7· осталось {sec} сек"
  code-expired: "&cКод истёк. Зайдите заново."

  confirm-1: "&eПодтвердите вход в Telegram — бот прислал сообщение."
  title-confirm: "&eПодтвердите вход"
  subtitle-confirm: "&fПроверьте Telegram"
  confirm-timeout: "&cВход не подтверждён вовремя."
  denied: "&cВход отклонён с вашего Telegram."
  approved: "&aВход подтверждён. Приятной игры!"

  trusted: "&aВход с доверенного устройства."
  linked: "&aTelegram &f{tg} &aпривязан. Добро пожаловать!"
  blocked: "&cСначала авторизуйтесь."
  frozen: "&cВход заблокирован из Telegram. Снимите блокировку командой /unfreeze у бота."
  unlinked-kick: "&cПривязка Telegram снята."
